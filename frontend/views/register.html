<div class="page-shell">
    <form class="form-card">
        <span class="eyebrow">Make room for stories</span><h1>Create an account</h1><p class="lead">Keep your favourite finds and orders together.</p>
        <label class="field"><span>Full name</span><input type="text" autocomplete="name" placeholder="Your name"></label>
        <label class="field"><span>Email address</span><input type="email" autocomplete="email" placeholder="you@example.com"></label>
        <label class="field"><span>Password</span><input type="password" autocomplete="new-password" placeholder="Create a password"></label>
        <button class="button button-primary" type="button" disabled>Create account</button>
        <p class="form-foot">Already have an account? <a href="#login">Sign in</a></p>
    </form>
</div>
